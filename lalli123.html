<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Sales Dashboard</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f9;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 8px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card h2 {
      color: #2563eb;
      margin-top: 10px;
    }

    .chart-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1d4ed8;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>Dynamic Sales Dashboard</h1>
    <p>Interactive sales data visualization</p>
  </header>

  <div class="container">

    <div class="cards">
      <div class="card">
        <p>Total Sales</p>
        <h2 id="totalSales">₹0</h2>
      </div>

      <div class="card">
        <p>Orders</p>
        <h2 id="totalOrders">0</h2>
      </div>

      <div class="card">
        <p>Average Sale</p>
        <h2 id="averageSale">₹0</h2>
      </div>
    </div>

    <div class="chart-box">
      <h2>Monthly Sales</h2>
      <br>
      <canvas id="salesChart"></canvas>
    </div>

    <button onclick="updateData()">Update Data</button>

  </div>

  <footer>
    <p>© 2026 Dynamic Dashboard</p>
  </footer>

  <script>
    // Initial data
    let salesData = {
      months: [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June"
      ],

      sales: [
        12000,
        19000,
        15000,
        22000,
        28000,
        25000
      ]
    };

    // Calculate dashboard values
    function updateDashboard() {
      const totalSales = salesData.sales.reduce(
        (sum, value) => sum + value,
        0
      );

      const totalOrders = salesData.sales.length * 25;

      const averageSale = totalSales / totalOrders;

      document.getElementById("totalSales").textContent =
        "₹" + totalSales.toLocaleString();

      document.getElementById("totalOrders").textContent =
        totalOrders;

      document.getElementById("averageSale").textContent =
        "₹" + Math.round(averageSale).toLocaleString();
    }

    // Create chart
    const ctx = document.getElementById("salesChart");

    const salesChart = new Chart(ctx, {
      type: "line",

      data: {
        labels: salesData.months,

        datasets: [{
          label: "Sales (₹)",
          data: salesData.sales,

          borderColor: "#2563eb",
          backgroundColor: "rgba(37, 99, 235, 0.15)",

          borderWidth: 3,
          fill: true,
          tension: 0.4
        }]
      },

      options: {
        responsive: true,

        plugins: {
          legend: {
            display: true
          }
        },

        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });

    // Dynamically generate new data
    function updateData() {

      salesData.sales = salesData.sales.map(function(value) {
        const change = Math.floor(
          Math.random() * 10000 - 5000
        );

        return Math.max(5000, value + change);
      });

      // Update chart
      salesChart.data.datasets[0].data =
        salesData.sales;

      salesChart.update();

      // Update cards
      updateDashboard();
    }

    // Initial dashboard
    updateDashboard();
  </script>

</body>
</html>
